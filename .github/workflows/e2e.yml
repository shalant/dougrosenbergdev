name: e2e

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned, not ubuntu-latest: when latest moved to 26.04 (between 2026-11-01 and 2026-11-07)
    # Playwright's WebKit build changed with it and the two theme-toggle specs began timing out
    # on webkit and mobile-safari only. Same Playwright and WebKit version, same code, still
    # green on Windows. Unpin once the 26.04 WebKit behavior is understood.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run verify-csp
      - run: npm run test:unit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
