<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="Montserrat, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="diag2Title diag2Desc">
  <title id="diag2Title">A mutable status field versus an append-only event log</title>
  <desc id="diag2Desc">On the left, a single status field is overwritten on every change with no history. On the right, a sequence of dated events is the source of truth, and current status is derived from the latest event.</desc>

  <rect x="0" y="0" width="800" height="420" rx="16" fill="#2c3e50" />

  <text x="200" y="42" text-anchor="middle" fill="rgba(238,242,247,0.7)" font-size="14" font-weight="700" letter-spacing="0.5">BEFORE — Lead.Status</text>
  <text x="600" y="42" text-anchor="middle" fill="#1abc9c" font-size="14" font-weight="700" letter-spacing="0.5">AFTER — ClientLead + LeadEvent</text>

  <line x1="400" y1="30" x2="400" y2="392" stroke="rgba(238,242,247,0.15)" stroke-width="1" />

  <!-- Left: single mutable field -->
  <rect x="90" y="150" width="220" height="80" rx="10" fill="#1a252f" stroke="rgba(238,242,247,0.35)" stroke-width="1.5" />
  <text x="200" y="185" text-anchor="middle" fill="#eef2f7" font-size="15" font-weight="700">Status: Contacted</text>
  <text x="200" y="207" text-anchor="middle" fill="rgba(238,242,247,0.5)" font-size="12">overwritten every change</text>

  <text x="200" y="270" text-anchor="middle" fill="rgba(238,242,247,0.55)" font-size="13">No record of when, or what</text>
  <text x="200" y="290" text-anchor="middle" fill="rgba(238,242,247,0.55)" font-size="13">happened in between.</text>

  <!-- Right: event timeline -->
  <line x1="470" y1="80" x2="470" y2="300" stroke="rgba(26,188,156,0.5)" stroke-width="2" />

  <circle cx="470" cy="100" r="6" fill="#1abc9c" />
  <text x="488" y="96" fill="#eef2f7" font-size="13" font-weight="600">Outreach sent</text>
  <text x="488" y="114" fill="rgba(238,242,247,0.5)" font-size="11">LeadEvent · dated</text>

  <circle cx="470" cy="170" r="6" fill="#1abc9c" />
  <text x="488" y="166" fill="#eef2f7" font-size="13" font-weight="600">Gig played</text>
  <text x="488" y="184" fill="rgba(238,242,247,0.5)" font-size="11">LeadEvent · dated</text>

  <circle cx="470" cy="240" r="6" fill="#1abc9c" />
  <text x="488" y="236" fill="#eef2f7" font-size="13" font-weight="600">Proposal sent</text>
  <text x="488" y="254" fill="rgba(238,242,247,0.5)" font-size="11">LeadEvent · dated</text>

  <line x1="470" y1="300" x2="470" y2="330" stroke="rgba(26,188,156,0.5)" stroke-width="2" stroke-dasharray="3 4" />

  <rect x="380" y="332" width="180" height="52" rx="8" fill="rgba(26,188,156,0.15)" stroke="#1abc9c" stroke-width="1.5" />
  <text x="470" y="354" text-anchor="middle" fill="#1abc9c" font-size="13" font-weight="700">CurrentStatus</text>
  <text x="470" y="372" text-anchor="middle" fill="rgba(238,242,247,0.6)" font-size="11">cached, derived from latest event</text>
</svg>
